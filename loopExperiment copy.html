<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Protocol: S = Σ(2i + 1)</title>
    <style>
        :root {
            --matrix-green: #008f11;
            --bright-green: #00FF41;
            --dark-bg: #050a05;
            --font-main: 'Consolas', 'Courier New', monospace;
            --cyan: #06b6d4;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--matrix-green);
            font-family: var(--font-main);
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Thống kê & Kết thúc */
        #victory-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .victory-content {
            border: 1px solid var(--matrix-green);
            padding: 40px;
            text-align: center;
            background: #000;
            max-width: 600px;
        }

        /* Màn hình chính */
        .main-stage {
            flex: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #1a3a1a;
        }

        .log-sidebar {
            flex: 3;
            background: #000;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--matrix-green);
            font-size: 0.85rem;
        }

        /* Variable Display */
        .variable-box {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .var-item {
            width: 120px;
            height: 90px;
            border: 1px solid var(--matrix-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 20, 0, 0.5);
        }

        .var-label { font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .var-value { font-size: 1.8rem; color: var(--bright-green); }

        #question-area {
            text-align: center;
            margin: 20px 0;
        }

        #formula-display {
            font-size: 1.2rem;
            color: var(--cyan);
            margin-bottom: 10px;
        }

        #question-text {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 10px var(--bright-green);
        }

        .btn {
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 15px 30px;
            cursor: pointer;
            font-family: var(--font-main);
            margin: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover { background: var(--matrix-green); color: #000; }

        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .log-success { color: var(--bright-green); }
        .log-err { color: #ff4444; }
        .log-info { color: var(--cyan); }

        /* Animation */
        .shake { animation: shake 0.2s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div id="victory-overlay">
        <div class="victory-content">
            <h1 style="color: var(--bright-green)">PROTOCOL COMPLETE</h1>
            <p id="final-stats" style="color: #ccc;"></p>
            <div style="background: #111; padding: 15px; text-align: left; margin: 20px 0; font-size: 0.9rem;">
                <code style="color: #a5d6a7;">
                    int S = 0;<br>
                    for (int i = 0; i <= n; i++) {<br>
                    &nbsp;&nbsp;S = S + (2*i + 1);<br>
                    }
                </code>
            </div>
            <button class="btn" onclick="location.reload()">RE-RUN</button>
        </div>
    </div>

    <div class="main-stage" id="stage">
        <div style="margin-bottom: 40px; opacity: 0.7;">> MISSION: SUMMATION OF ODD NUMBERS [0 -> n]</div>

        <div class="variable-box">
            <div class="var-item">
                <span class="var-label">Biến i</span>
                <span id="var-i" class="var-value">0</span>
            </div>
            <div class="var-item">
                <span class="var-label">Tổng S</span>
                <span id="var-s" class="var-value">0</span>
            </div>
            <div class="var-item">
                <span class="var-label">Giới hạn n</span>
                <span id="var-n" class="var-value">-</span>
            </div>
        </div>

        <div id="question-area">
            <div id="formula-display">Công thức bước này: S + (2*i + 1)</div>
            <div id="question-text">Đang tải...</div>
            <p style="color: #555;">Kết quả trên ĐÚNG hay SAI?</p>
        </div>

        <div>
            <button class="btn" onclick="processAnswer(true)">ĐÚNG (TRUE)</button>
            <button class="btn" onclick="processAnswer(false)">SAI (FALSE)</button>
        </div>
    </div>

    <div class="log-sidebar" id="system-log">
        <div class="log-entry">> Initializing Sum Protocol...</div>
    </div>

    <script>
        let sumS = 0;
        let currentI = 0;
        let nValue = 0;
        let isCorrectGuess = false;
        let totalQuestions = 0;
        let correctAnswers = 0;

        // Audio Context cho hiệu ứng âm thanh
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function initGame() {
            sumS = 0;
            currentI = 0;
            nValue = Math.floor(Math.random() * 4) + 3; // n chạy từ 3 đến 6
            addLog(`Hệ thống thiết lập n = ${nValue}. Bắt đầu vòng lặp.`, 'info');
            generateQuestion();
        }

        function generateQuestion() {
            // Logic: Số lẻ = 2i + 1
            let oddIncrement = (2 * currentI) + 1;
            let actualNextSum = sumS + oddIncrement;
            
            // Random câu trả lời hiển thị
            isCorrectGuess = Math.random() > 0.5;
            let displaySum = isCorrectGuess ? actualNextSum : actualNextSum + (Math.floor(Math.random() * 5) + 1);

            // Cập nhật UI
            document.getElementById('var-i').innerText = currentI;
            document.getElementById('var-s').innerText = sumS;
            document.getElementById('var-n').innerText = nValue;
            document.getElementById('question-text').innerText = `${sumS} + (2*${currentI} + 1) = ${displaySum}?`;
            
            addLog(`Bước i = ${currentI}: Kiểm tra phép cộng ${sumS} + ${oddIncrement}`);
        }

        function processAnswer(userAnswer) {
            totalQuestions++;
            let oddIncrement = (2 * currentI) + 1;

            if (userAnswer === isCorrectGuess) {
                playSound('correct');
                correctAnswers++;
                sumS += oddIncrement; // Cập nhật tổng thực tế
                addLog(`Chính xác! S tăng lên ${sumS}`, 'log-success');
                
                if (currentI < nValue) {
                    currentI++;
                    setTimeout(generateQuestion, 600);
                } else {
                    addLog("Vòng lặp kết thúc. Điều kiện i <= n không còn thỏa mãn.", "info");
                    setTimeout(showVictory, 1000);
                }
            } else {
                playSound('wrong');
                addLog(`Sai! Với i=${currentI}, giá trị cộng vào phải là ${oddIncrement}.`, 'log-err');
                
                const stage = document.getElementById('stage');
                stage.classList.add('shake');
                setTimeout(() => stage.classList.remove('shake'), 200);
            }
        }

        function addLog(msg, className = '') {
            const log = document.getElementById('system-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${className}`;
            entry.innerText = `> ${msg}`;
            log.prepend(entry);
        }

        function showVictory() {
            document.getElementById('victory-overlay').style.display = 'flex';
            document.getElementById('final-stats').innerText = 
                `Kết quả: ${correctAnswers}/${totalQuestions} câu đúng. Tổng cuối S = ${sumS}`;
        }

        // Tự động chạy khi load trang
        window.onload = initGame;
    </script>
</body>
</html>
